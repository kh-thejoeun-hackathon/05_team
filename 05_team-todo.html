<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weekly Routine Planner</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --panel: #ffffff;
        --panel-soft: #eef4ff;
        --primary: #4f6ef7;
        --primary-strong: #3453dc;
        --accent: #8b5cf6;
        --text: #1d2433;
        --muted: #68758a;
        --line: #e7ebf3;
        --success: #36b37e;
        --warning: #ffb648;
        --shadow: 0 18px 38px rgba(28, 48, 91, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        font-family: "Pretendard", "Apple SD Gothic Neo", "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #edf3ff 0%, #f9f7ff 100%);
        color: var(--text);
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 32px;
      }

      .app {
        width: min(1200px, 100%);
        min-height: 760px;
        background: rgba(255, 255, 255, 0.72);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 30px;
        box-shadow: var(--shadow);
        display: grid;
        grid-template-columns: 380px 1fr;
        overflow: hidden;
      }

      .calendar-panel {
        background: linear-gradient(180deg, #f7faff 0%, #eef3ff 100%);
        border-right: 1px solid var(--line);
        padding: 28px 22px;
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 18px;
      }

      .month-nav {
        width: 38px;
        height: 38px;
        border: none;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 8px 18px rgba(79, 110, 247, 0.12);
        font-size: 1.2rem;
        color: var(--text);
        cursor: pointer;
      }

      .month-title {
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .week-grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 10px;
        margin-top: 18px;
      }

      .day-card {
        border: 1px solid transparent;
        background: rgba(255, 255, 255, 0.8);
        border-radius: 20px;
        padding: 12px 8px 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        transition: all 0.2s ease;
        min-height: 120px;
      }

      .day-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 22px rgba(79, 110, 247, 0.08);
      }

      .day-card.active {
        background: linear-gradient(180deg, #4f6ef7 0%, #3253d8 100%);
        color: white;
        box-shadow: 0 16px 24px rgba(79, 110, 247, 0.35);
      }

      .day-name {
        font-size: 0.72rem;
        opacity: 0.9;
        font-weight: 600;
      }

      .day-number {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: rgba(79, 110, 247, 0.1);
        color: var(--text);
        font-weight: 700;
      }

      .day-card.active .day-number {
        background: rgba(255, 255, 255, 0.18);
        color: white;
      }

      .day-metric {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 5px;
        font-size: 0.68rem;
        color: var(--muted);
        min-height: 18px;
      }

      .day-card.active .day-metric {
        color: rgba(255, 255, 255, 0.82);
      }

      .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--success);
      }

      .summary-card {
        margin-top: 24px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 18px 18px 16px;
      }

      .memo-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .memo-add-book-btn {
        border: none;
        border-radius: 10px;
        background: rgba(79, 110, 247, 0.12);
        color: var(--primary-strong);
        padding: 7px 10px;
        font-size: 0.8rem;
        font-weight: 700;
        cursor: pointer;
      }

      .memo-added-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 12px;
      }

      .memo-entry {
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }

      .memo-entry textarea {
        flex: 1;
        min-height: 84px;
        resize: vertical;
      }

      .memo-entry-remove {
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 10px;
        color: var(--muted);
        padding: 6px 10px;
        cursor: pointer;
      }

      .memo-shell {
        position: relative;
        border-radius: 20px;
        overflow: hidden;
        border: 1px solid var(--line);
        background: linear-gradient(180deg, rgba(255,255,255,0.24), rgba(255,255,255,0.56));
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25);
        padding-bottom: 14px;
      }

      .memo-shell textarea {
        background: rgba(255, 255, 255, 0.28);
        border: 1px solid rgba(255,255,255,0.38);
      }

      .memo-attachment-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 12px 14px 0;
      }

      .memo-photo-strip {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        min-height: 42px;
      }

      .memo-photo-thumb {
        position: relative;
        width: 46px;
        height: 46px;
        border-radius: 12px;
        border: 2px solid rgba(255,255,255,0.75);
        overflow: hidden;
        background: #fff;
        box-shadow: 0 8px 18px rgba(40, 65, 120, 0.12);
        padding: 0;
        cursor: pointer;
      }

      .memo-photo-item {
        position: relative;
        width: 46px;
        height: 46px;
      }

      .memo-photo-item .memo-photo-thumb {
        width: 100%;
        height: 100%;
      }

      .memo-photo-remove {
        position: absolute;
        top: -7px;
        right: -7px;
        width: 19px;
        height: 19px;
        border: 2px solid #fff;
        border-radius: 50%;
        background: #44516a;
        color: #fff;
        font-size: 0.72rem;
        line-height: 1;
        padding: 0;
        cursor: pointer;
        z-index: 1;
      }

      .memo-photo-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .memo-add-photo-btn {
        width: 42px;
        height: 42px;
        border: none;
        border-radius: 12px;
        background: rgba(79, 110, 247, 0.12);
        color: var(--primary-strong);
        font-size: 1.7rem;
        font-weight: 700;
        cursor: pointer;
        display: grid;
        place-items: center;
        line-height: 1;
      }

      .emotion-panel {
        margin: 18px 14px 0;
        padding-top: 16px;
        border-top: 1px solid rgba(104, 117, 138, 0.16);
      }

      .emotion-title {
        margin: 0 0 12px;
        font-size: 0.9rem;
        color: var(--text);
      }

      .emotion-list {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .emotion-item {
        display: grid;
        grid-template-columns: 30px minmax(80px, 1fr) 42px;
        align-items: center;
        gap: 8px;
      }

      .emotion-icon {
        font-size: 1.35rem;
        text-align: center;
      }

      .emotion-slider {
        width: 100%;
        height: 6px;
        appearance: none;
        border-radius: 999px;
        background: linear-gradient(to right, hsl(var(--emotion-hue) 72% var(--emotion-lightness)) var(--emotion-level), rgba(79, 110, 247, 0.16) var(--emotion-level));
        cursor: pointer;
      }

      .emotion-slider::-webkit-slider-thumb {
        width: 16px;
        height: 16px;
        appearance: none;
        border: 3px solid #fff;
        border-radius: 50%;
        background: var(--primary-strong);
        box-shadow: 0 2px 7px rgba(52, 83, 220, 0.28);
      }

      .emotion-slider::-moz-range-thumb {
        width: 12px;
        height: 12px;
        border: 3px solid #fff;
        border-radius: 50%;
        background: var(--primary-strong);
        box-shadow: 0 2px 7px rgba(52, 83, 220, 0.28);
      }

      .emotion-value {
        color: var(--primary-strong);
        font-size: 0.78rem;
        font-weight: 700;
        text-align: right;
      }

      @media (max-width: 620px) {
        .emotion-list {
          grid-template-columns: 1fr;
        }

        .emotion-item {
          grid-template-columns: 30px minmax(0, 1fr) 42px;
        }
      }

      .memo-image-modal {
        position: fixed;
        inset: 0;
        background: rgba(14, 20, 33, 0.72);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 32px;
        z-index: 50;
      }

      .memo-image-modal.show {
        display: flex;
      }

      .memo-image-modal-inner {
        position: relative;
        max-width: min(760px, 90vw);
        max-height: 80vh;
        background: rgba(255,255,255,0.96);
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 0 28px 60px rgba(15, 25, 42, 0.26);
      }

      .memo-image-modal-inner img {
        display: block;
        max-width: 100%;
        max-height: 80vh;
        object-fit: contain;
      }

      .memo-image-close {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 36px;
        height: 36px;
        border: none;
        border-radius: 50%;
        background: rgba(19, 24, 36, 0.7);
        color: white;
        font-size: 1.4rem;
        cursor: pointer;
      }

      .summary-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
      }

      .summary-header h3 {
        margin: 0;
        font-size: 0.98rem;
      }

      .progress-badge {
        padding: 6px 8px;
        border-radius: 999px;
        background: rgba(54, 179, 126, 0.12);
        color: var(--success);
        font-size: 0.72rem;
        font-weight: 700;
      }

      .progress-bar {
        height: 12px;
        background: #edf1f7;
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 12px;
      }

      .progress-bar > span {
        display: block;
        height: 100%;
        width: 68%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--primary), var(--accent));
      }

      .summary-stats {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 0.76rem;
        color: var(--muted);
      }

      .routine-panel {
        margin-top: 24px;
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 16px 14px 12px;
      }

      .routine-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }

      .routine-label {
        font-size: 0.82rem;
        font-weight: 700;
        color: var(--muted);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .routine-add-btn {
        border: none;
        border-radius: 10px;
        background: rgba(79, 110, 247, 0.1);
        color: var(--primary-strong);
        font-weight: 700;
        padding: 8px 11px;
        cursor: pointer;
      }

      .routine-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .routine-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 10px;
        border-radius: 14px;
        background: linear-gradient(135deg, #f7f9ff 0%, #eef4ff 100%);
        border: 1px solid #ecf0ff;
      }

      .routine-main {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .routine-bullet {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--primary), var(--accent));
        flex-shrink: 0;
      }

      .routine-text {
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .routine-meta {
        font-size: 0.68rem;
        color: var(--muted);
        background: rgba(79, 110, 247, 0.08);
        padding: 5px 7px;
        border-radius: 999px;
        white-space: nowrap;
      }

      .header-tools {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .weather-picker {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 8px;
        border-radius: 999px;
        background: rgba(79, 110, 247, 0.08);
        border: 1px solid rgba(79, 110, 247, 0.12);
      }

      .weather-btn {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: none;
        background: transparent;
        font-size: 1.1rem;
        cursor: pointer;
        display: grid;
        place-items: center;
        transition: all 0.2s ease;
      }

      .weather-btn.active {
        background: linear-gradient(135deg, var(--primary), var(--accent));
        box-shadow: 0 8px 18px rgba(79, 110, 247, 0.22);
      }

      .content-panel {
        background: rgba(255, 255, 255, 0.72);
        padding: 28px 30px 30px;
      }

      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 20px;
      }

      .day-label {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .day-label small {
        color: var(--muted);
        font-weight: 600;
      }

      .day-label h2 {
        margin: 0;
        font-size: clamp(1.7rem, 2vw, 2.3rem);
        letter-spacing: -0.05em;
      }

      .primary-btn,
      .ghost-btn {
        border: none;
        border-radius: 14px;
        padding: 12px 18px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s ease;
      }

      .primary-btn {
        background: linear-gradient(90deg, var(--primary), var(--accent));
        color: white;
        box-shadow: 0 12px 24px rgba(79, 110, 247, 0.22);
      }

      .ghost-btn {
        background: #f3f7ff;
        color: var(--primary-strong);
      }

      .primary-btn:hover,
      .ghost-btn:hover,
      .month-nav:hover {
        transform: translateY(-1px);
      }

      .status-strip {
        display: flex;
        gap: 16px;
        margin-bottom: 22px;
      }

      .status-card {
        flex: 1;
        border-radius: 20px;
        padding: 18px 20px;
        background: linear-gradient(135deg, #eef4ff 0%, #ffffff 100%);
        border: 1px solid var(--line);
      }

      .status-card .label {
        display: block;
        margin-bottom: 10px;
        font-size: 0.76rem;
        color: var(--muted);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .status-card strong {
        font-size: 1.65rem;
        letter-spacing: -0.04em;
      }

      .status-card .sub {
        margin-top: 10px;
        color: var(--muted);
        font-size: 0.78rem;
      }

      .panel-layout {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 22px;
      }

      .alarm-panel {
        margin-top: 22px;
      }

      .alarm-form {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 18px;
      }

      .alarm-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .alarm-form input {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #f9fbff;
        font: inherit;
        color: var(--text);
      }

      .alarm-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .alarm-item {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
        padding: 12px 12px;
        border-radius: 14px;
        background: #f4f7ff;
        border: 1px solid #e5ecff;
      }

      .alarm-item-title {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .alarm-item strong {
        font-size: 0.96rem;
      }

      .alarm-item small {
        color: var(--muted);
      }

      .alarm-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .alarm-toggle,
      .alarm-delete {
        border: none;
        border-radius: 10px;
        padding: 7px 10px;
        font-weight: 700;
        cursor: pointer;
      }

      .alarm-toggle {
        background: rgba(54, 179, 126, 0.12);
        color: var(--success);
      }

      .alarm-delete {
        background: rgba(255, 99, 132, 0.08);
        color: #e25174;
      }

      .section-card {
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 18px 18px 16px;
      }

      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
      }

      .section-header h3 {
        margin: 0;
        font-size: 1.05rem;
      }

      .checklist {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .checklist li {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 12px;
        border-radius: 16px;
        background: #f8fafe;
        border: 1px solid #edf1f7;
      }

      .checklist input[type="checkbox"] {
        appearance: none;
        width: 22px;
        height: 22px;
        border: 2px solid #d7def5;
        border-radius: 8px;
        background: white;
        position: relative;
        cursor: pointer;
      }

      .checklist input[type="checkbox"]:checked {
        background: linear-gradient(135deg, var(--primary), var(--accent));
        border-color: transparent;
      }

      .checklist input[type="checkbox"]:checked::after {
        content: "";
        position: absolute;
        left: 7px;
        top: 3px;
        width: 5px;
        height: 10px;
        border: solid white;
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
      }

      .task-text {
        flex: 1;
        font-weight: 600;
        color: var(--text);
      }

      .checklist input[type="checkbox"]:checked + .task-text {
        text-decoration: line-through;
        color: var(--muted);
      }

      .tag {
        border-radius: 999px;
        padding: 5px 8px;
        font-size: 0.68rem;
        font-weight: 700;
        background: rgba(79, 110, 247, 0.12);
        color: var(--primary-strong);
      }

      textarea {
        width: 100%;
        min-height: 220px;
        resize: vertical;
        border: none;
        border-radius: 18px;
        padding: 16px 18px;
        font: inherit;
        background: rgba(255, 255, 255, 0.42);
        color: var(--text);
        backdrop-filter: blur(2px);
      }

      textarea:focus,
      .checklist input:focus {
        outline: 2px solid rgba(79, 110, 247, 0.2);
        outline-offset: 1px;
      }

      @media (max-width: 980px) {
        .app {
          grid-template-columns: 1fr;
        }

        .calendar-panel {
          border-right: none;
          border-bottom: 1px solid var(--line);
        }

        .panel-layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="calendar-panel">
        <div class="panel-header">
          <button class="month-nav" type="button" aria-label="Previous month">‹</button>
          <div class="month-title" id="monthTitle">2026년 9월</div>
          <button class="month-nav" type="button" aria-label="Next month">›</button>
        </div>

        <div class="week-grid" id="weekGrid"></div>

        <div class="summary-card">
          <div class="summary-header">
            <h3>이번 주 진행률</h3>
            <span class="progress-badge" id="weeklyProgressBadge">68%</span>
          </div>
          <div class="progress-bar"><span id="weeklyProgressBar"></span></div>
          <div class="summary-stats">
            <span>완료 <strong id="doneCount">12</strong></span>
            <span>남은 할 일 <strong id="leftCount">7</strong></span>
          </div>
        </div>

        <div class="routine-panel">
          <div class="routine-header">
            <span class="routine-label">현재 루틴</span>
            <button class="routine-add-btn" id="routineAddBtn" type="button">+ 루틴 추가</button>
          </div>
          <ul class="routine-list" id="routineList"></ul>
        </div>
      </aside>

      <main class="content-panel">
        <div class="top-bar">
          <div class="day-label">
            <small id="dayShortLabel">Monday</small>
            <h2 id="selectedDateTitle">9월 1일</h2>
          </div>

          <div class="header-tools">
            <div class="weather-picker" id="weatherPicker" aria-label="날씨 선택">
              <button class="weather-btn active" type="button" data-weather="sun" title="맑음">☀️</button>
              <button class="weather-btn" type="button" data-weather="cloud" title="구름">⛅</button>
              <button class="weather-btn" type="button" data-weather="rain" title="비">🌧️</button>
              <button class="weather-btn" type="button" data-weather="storm" title="번개">⛈️</button>
            </div>
          </div>
        </div>

        <div class="status-strip">
          <div class="status-card">
            <span class="label">오늘 완료</span>
            <strong id="todayDone">3/5</strong>
            <div class="sub">좋아요! 꾸준히 유지 중이에요.</div>
          </div>
          <div class="status-card">
            <span class="label">오늘 메모</span>
            <strong id="memoCount">1개</strong>
            <div class="sub">필요한 포인트를 정리해두세요.</div>
          </div>
        </div>

        <div class="panel-layout">
          <section class="section-card">
            <div class="section-header">
              <h3>오늘의 체크리스트</h3>
              <button class="ghost-btn" id="taskAddBtn" type="button">추가</button>
            </div>
            <ul class="checklist" id="checklist"></ul>
          </section>

          <section class="section-card" style="background: linear-gradient(180deg, rgba(255,255,255,0.72), rgba(255,255,255,0.88));">
            <div class="section-header memo-header">
              <h3>하루 메모</h3>
              <button class="memo-add-book-btn" id="memoAddBookBtn" type="button">+ 추가</button>
            </div>
            <div class="memo-shell">
              <textarea id="memoInput" placeholder="오늘의 생각, 해야 할 일, 감정을 적어보세요."></textarea>
              <div class="memo-added-list" id="memoAddedList"></div>

              <div class="memo-attachment-bar">
                <div class="memo-photo-strip" id="memoPhotoStrip"></div>
                <button class="memo-add-photo-btn" id="memoAddPhotoBtn" type="button" aria-label="사진 추가">+</button>
                <input id="memoImageInput" type="file" accept="image/*" hidden />
              </div>

              <div class="emotion-panel">
                <h4 class="emotion-title">그날의 감정</h4>
                <div class="emotion-list" id="emotionList"></div>
              </div>
            </div>
          </section>
        </div>

        <div class="memo-image-modal" id="memoImageModal" aria-hidden="true">
          <div class="memo-image-modal-inner">
            <button class="memo-image-close" id="memoImageModalClose" type="button" aria-label="닫기">×</button>
            <img id="memoImageModalImg" alt="메모 이미지 크게 보기" />
          </div>
        </div>

        <section class="section-card alarm-panel">
          <div class="section-header">
            <h3>스케줄 알람</h3>
          </div>

          <div class="alarm-form">
            <input id="alarmTitle" type="text" placeholder="알람 제목을 입력하세요" maxlength="40" />
            <div class="alarm-row">
              <input id="alarmDate" type="date" />
              <input id="alarmTime" type="time" />
            </div>
            <button class="primary-btn" id="saveAlarmBtn" type="button">알람 저장</button>
          </div>

          <ul class="alarm-list" id="alarmList"></ul>
        </section>
      </main>
    </div>

    <script>
      const stateKey = 'weekly-routine-planner-v1';
      const weekDays = ['월', '화', '수', '목', '금', '토', '일'];
      const weatherOptions = {
        sun: { icon: '☀️', label: '맑음' },
        cloud: { icon: '⛅', label: '구름' },
        rain: { icon: '🌧️', label: '비' },
        storm: { icon: '⛈️', label: '번개' }
      };
      const defaultTasks = [
        { id: 1, text: '아침 운동', tag: '건강' },
        { id: 2, text: '개인 공부 30분', tag: '학습' },
        { id: 3, text: '업무 우선순위 정리', tag: '업무' },
        { id: 4, text: '점심 식사 챙기기', tag: '식사' },
        { id: 5, text: '하루 정리', tag: '회고' }
      ];
      const defaultRoutines = [
        { id: 1, title: '아침 산책', repeat: '매일', weather: 'sun' },
        { id: 2, title: '스트레칭', repeat: '주 5회', weather: 'cloud' },
        { id: 3, title: '독서 20분', repeat: '매일', weather: 'rain' }
      ];
      const emotionOptions = [
        { id: 'happy', icon: '😀', label: '웃는 표정' },
        { id: 'sad', icon: '😢', label: '우는 표정' },
        { id: 'angry', icon: '😠', label: '화난 표정' },
        { id: 'neutral', icon: '😐', label: '무표정' }
      ];

      const today = new Date();
      let selectedDate = new Date(today);

      function makeDateKey(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      }

      function getStoredState() {
        const raw = localStorage.getItem(stateKey);
        if (!raw) return {};

        try {
          return JSON.parse(raw);
        } catch (error) {
          return {};
        }
      }

      function saveState(data) {
        localStorage.setItem(stateKey, JSON.stringify(data));
      }

      function getWeekStart(date) {
        const d = new Date(date);
        const day = d.getDay();
        const diff = day === 0 ? -6 : 1 - day;
        d.setHours(0, 0, 0, 0);
        d.setDate(d.getDate() + diff);
        return d;
      }

      function formatDateKo(date) {
        return `${date.getMonth() + 1}월 ${date.getDate()}일`;
      }

      function formatDayLabel(date) {
        const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
        return dayNames[date.getDay()];
      }

      function getTasksForDate(dateKey) {
        const state = getStoredState();
        const dayData = state[dateKey];
        if (!dayData || !Array.isArray(dayData.tasks)) {
          return defaultTasks.map((task) => ({ ...task, done: false }));
        }
        return dayData.tasks;
      }

      function setTasksForDate(dateKey, tasks) {
        const state = getStoredState();
        state[dateKey] = {
          ...(state[dateKey] || {}),
          tasks,
          memo: state[dateKey]?.memo || ''
        };
        saveState(state);
      }

      function getMemoForDate(dateKey) {
        const state = getStoredState();
        if (Array.isArray(state[dateKey]?.memoEntries) && state[dateKey].memoEntries.length) {
          return state[dateKey].memoEntries[0].text || '';
        }
        return state[dateKey]?.memo || '';
      }

      function setMemoForDate(dateKey, memo) {
        const state = getStoredState();
        const memoEntries = Array.isArray(state[dateKey]?.memoEntries) && state[dateKey].memoEntries.length
          ? state[dateKey].memoEntries
          : [{ id: Date.now(), text: memo || '' }];

        memoEntries[0] = { ...(memoEntries[0] || {}), id: memoEntries[0]?.id || Date.now(), text: memo || '' };

        state[dateKey] = {
          ...(state[dateKey] || {}),
          memo,
          memoEntries,
          tasks: state[dateKey]?.tasks || getTasksForDate(dateKey)
        };
        saveState(state);
      }

      function getMemoEntriesForDate(dateKey) {
        const state = getStoredState();

        if (Array.isArray(state[dateKey]?.memoEntries) && state[dateKey].memoEntries.length) {
          return state[dateKey].memoEntries;
        }

        const initialText = state[dateKey]?.memo || '';
        const fallback = [{ id: Date.now(), text: initialText }];
        state[dateKey] = {
          ...(state[dateKey] || {}),
          memo: initialText,
          memoEntries: fallback,
          tasks: state[dateKey]?.tasks || getTasksForDate(dateKey)
        };
        saveState(state);
        return fallback;
      }

      function setMemoEntriesForDate(dateKey, entries) {
        const state = getStoredState();
        const safeEntries = entries.filter((entry) => entry && typeof entry.text === 'string');
        const normalizedEntries = safeEntries.length ? safeEntries : [{ id: Date.now(), text: '' }];

        state[dateKey] = {
          ...(state[dateKey] || {}),
          memo: normalizedEntries[0]?.text || '',
          memoEntries: normalizedEntries,
          tasks: state[dateKey]?.tasks || getTasksForDate(dateKey)
        };
        saveState(state);
      }

      function getMemoImagesForDate(dateKey) {
        const state = getStoredState();
        return Array.isArray(state[dateKey]?.memoImages) ? state[dateKey].memoImages : [];
      }

      function setMemoImagesForDate(dateKey, images) {
        const state = getStoredState();
        state[dateKey] = {
          ...(state[dateKey] || {}),
          memoImages: images,
          tasks: state[dateKey]?.tasks || getTasksForDate(dateKey),
          memo: state[dateKey]?.memo || ''
        };
        saveState(state);
      }

      function getEmotionsForDate(dateKey) {
        const state = getStoredState();
        const saved = state[dateKey]?.emotions;
        return emotionOptions.reduce((emotions, emotion) => {
          const value = Number(saved?.[emotion.id]);
          emotions[emotion.id] = Number.isFinite(value) ? Math.max(0, Math.min(100, value)) : 25;
          return emotions;
        }, {});
      }

      function setEmotionsForDate(dateKey, emotions) {
        const state = getStoredState();
        state[dateKey] = {
          ...(state[dateKey] || {}),
          emotions,
          tasks: state[dateKey]?.tasks || getTasksForDate(dateKey),
          memo: state[dateKey]?.memo || ''
        };
        saveState(state);
      }

      function getAlarmsForDate(dateKey) {
        const state = getStoredState();
        return Array.isArray(state[dateKey]?.alarms) ? state[dateKey].alarms : [];
      }

      function setAlarmsForDate(dateKey, alarms) {
        const state = getStoredState();
        state[dateKey] = {
          ...(state[dateKey] || {}),
          alarms,
          tasks: state[dateKey]?.tasks || getTasksForDate(dateKey),
          memo: state[dateKey]?.memo || ''
        };
        saveState(state);
      }

      function getRoutinesForDate(dateKey) {
        const state = getStoredState();
        if (!state[dateKey] || !Array.isArray(state[dateKey].routines)) {
          return defaultRoutines.map((item) => ({ ...item }));
        }
        return state[dateKey].routines;
      }

      function setRoutinesForDate(dateKey, routines) {
        const state = getStoredState();
        state[dateKey] = {
          ...(state[dateKey] || {}),
          routines,
          tasks: state[dateKey]?.tasks || getTasksForDate(dateKey),
          memo: state[dateKey]?.memo || '',
          alarms: state[dateKey]?.alarms || []
        };
        saveState(state);
      }

      function getWeatherForDate(dateKey) {
        const state = getStoredState();
        return state[dateKey]?.weather || 'sun';
      }

      function setWeatherForDate(dateKey, weather) {
        const state = getStoredState();
        state[dateKey] = {
          ...(state[dateKey] || {}),
          weather,
          tasks: state[dateKey]?.tasks || getTasksForDate(dateKey),
          memo: state[dateKey]?.memo || '',
          alarms: state[dateKey]?.alarms || [],
          routines: state[dateKey]?.routines || getRoutinesForDate(dateKey)
        };
        saveState(state);
      }

      function updateWeeklyProgress() {
        const weekStart = getWeekStart(selectedDate);
        const total = 7;
        let done = 0;

        for (let i = 0; i < total; i++) {
          const d = new Date(weekStart);
          d.setDate(weekStart.getDate() + i);
          const tasks = getTasksForDate(makeDateKey(d));
          done += tasks.filter((task) => task.done).length;
        }

        const weeklyTotal = total * defaultTasks.length;
        const progress = Math.min(100, Math.round((done / weeklyTotal) * 100));
        const doneCount = document.getElementById('doneCount');
        const leftCount = document.getElementById('leftCount');
        const weeklyProgressBadge = document.getElementById('weeklyProgressBadge');
        const weeklyProgressBar = document.getElementById('weeklyProgressBar');

        doneCount.textContent = `${Math.round(done / defaultTasks.length)}`;
        leftCount.textContent = `${7 - Math.round(done / defaultTasks.length)}`;
        weeklyProgressBadge.textContent = `${progress}%`;
        weeklyProgressBar.style.width = `${progress}%`;
      }

      function renderCalendar() {
        const weekStart = getWeekStart(selectedDate);
        const monthTitle = document.getElementById('monthTitle');
        monthTitle.textContent = `${selectedDate.getMonth() + 1}월 ${selectedDate.getDate()}일`;

        const grid = document.getElementById('weekGrid');
        grid.innerHTML = '';

        for (let i = 0; i < 7; i++) {
          const current = new Date(weekStart);
          current.setDate(weekStart.getDate() + i);
          const key = makeDateKey(current);
          const tasks = getTasksForDate(key);
          const doneCount = tasks.filter((task) => task.done).length;
          const cards = document.createElement('button');
          cards.type = 'button';
          cards.className = 'day-card' + (makeDateKey(selectedDate) === key ? ' active' : '');
          cards.innerHTML = `
            <span class="day-name">${weekDays[current.getDay() === 0 ? 6 : current.getDay() - 1]}</span>
            <span class="day-number">${current.getDate()}</span>
            <span class="day-metric"><span class="dot"></span> ${doneCount}/${tasks.length}</span>
          `;
          cards.addEventListener('click', () => {
            selectedDate = new Date(current);
            renderCalendar();
            renderChecklist();
            renderAlarms();
          });
          grid.appendChild(cards);
        }
      }

      function renderChecklist() {
        const key = makeDateKey(selectedDate);
        const tasks = getTasksForDate(key);
        const checklist = document.getElementById('checklist');
        const memoInput = document.getElementById('memoInput');
        const selectedDateTitle = document.getElementById('selectedDateTitle');
        const dayShortLabel = document.getElementById('dayShortLabel');
        const todayDone = document.getElementById('todayDone');
        const memoCount = document.getElementById('memoCount');

        selectedDateTitle.textContent = formatDateKo(selectedDate);
        dayShortLabel.textContent = `${formatDayLabel(selectedDate)}요일`;

        checklist.innerHTML = tasks
          .map(
            (task, index) => `
              <li>
                <input type="checkbox" ${task.done ? 'checked' : ''} data-index="${index}" aria-label="${task.text}" />
                <span class="task-text">${task.text}</span>
                <span class="tag">${task.tag}</span>
              </li>
            `
          )
          .join('');

        checklist.querySelectorAll('input[type="checkbox"]').forEach((checkbox) => {
          checkbox.addEventListener('change', (event) => {
            const index = Number(event.target.dataset.index);
            const taskList = getTasksForDate(key);
            taskList[index].done = event.target.checked;
            setTasksForDate(key, taskList);
            renderCalendar();
            renderChecklist();
          });
        });

        const doneTasks = tasks.filter((task) => task.done).length;
        todayDone.textContent = `${doneTasks}/${tasks.length}`;

        const memoEntries = getMemoEntriesForDate(key);
        const memoText = memoEntries[0]?.text || '';
        memoInput.value = memoText;
        renderMemoEntryList();
        memoCount.textContent = memoText.trim() ? '1개' : '0개';

        renderMemoImages();
        renderEmotions();
        updateWeeklyProgress();
      }

      function renderEmotions() {
        const key = makeDateKey(selectedDate);
        const emotions = getEmotionsForDate(key);
        const emotionList = document.getElementById('emotionList');

        emotionList.innerHTML = emotionOptions
          .map(
            (emotion) => `
              <label class="emotion-item" for="emotion-${emotion.id}">
                <span class="emotion-icon" title="${emotion.label}" aria-hidden="true">${emotion.icon}</span>
                <input class="emotion-slider" id="emotion-${emotion.id}" type="range" min="0" max="100" value="${emotions[emotion.id]}" data-emotion="${emotion.id}" style="${getEmotionSliderStyle(emotions[emotion.id])}" aria-label="${emotion.label} 비율" />
                <output class="emotion-value" for="emotion-${emotion.id}">${emotions[emotion.id]}%</output>
              </label>
            `
          )
          .join('');

        emotionList.querySelectorAll('.emotion-slider').forEach((slider) => {
          slider.addEventListener('input', (event) => {
            const emotionId = event.target.dataset.emotion;
            const updatedEmotions = getEmotionsForDate(key);
            updatedEmotions[emotionId] = Number(event.target.value);
            setEmotionsForDate(key, updatedEmotions);
            const sliderStyle = getEmotionSliderStyle(Number(event.target.value));
            sliderStyle.split(';').forEach((property) => {
              const [name, value] = property.split(':').map((part) => part.trim());
              if (name && value) event.target.style.setProperty(name, value);
            });
            event.target.nextElementSibling.value = `${event.target.value}%`;
          });
        });
      }

      function getEmotionSliderStyle(value) {
        const ratio = Math.max(0, Math.min(100, Number(value))) / 100;
        const hue = 220;
        const lightness = Math.round(78 - ratio * 36);
        return `--emotion-level: ${Math.round(ratio * 100)}%; --emotion-hue: ${hue}; --emotion-lightness: ${lightness}%`;
      }

      function renderMemoEntryList() {
        const key = makeDateKey(selectedDate);
        const entries = getMemoEntriesForDate(key);
        const memoAddedList = document.getElementById('memoAddedList');

        if (entries.length <= 1) {
          memoAddedList.innerHTML = '';
          return;
        }

        memoAddedList.innerHTML = entries
          .slice(1)
          .map(
            (entry) => `
              <div class="memo-entry">
                <textarea data-entry-id="${entry.id}" placeholder="추가 메모장">${entry.text}</textarea>
                <button class="memo-entry-remove" type="button" data-entry-id="${entry.id}">삭제</button>
              </div>
            `
          )
          .join('');

        memoAddedList.querySelectorAll('textarea').forEach((textarea) => {
          textarea.addEventListener('input', (event) => {
            const targetId = Number(event.target.dataset.entryId);
            const items = getMemoEntriesForDate(key).map((entry) =>
              entry.id === targetId ? { ...entry, text: event.target.value } : entry
            );
            setMemoEntriesForDate(key, items);
            renderChecklist();
          });
        });

        memoAddedList.querySelectorAll('.memo-entry-remove').forEach((button) => {
          button.addEventListener('click', () => {
            const targetId = Number(button.dataset.entryId);
            const items = getMemoEntriesForDate(key).filter((entry) => entry.id !== targetId);
            if (!items.length) {
              items.push({ id: Date.now(), text: '' });
            }
            setMemoEntriesForDate(key, items);
            renderChecklist();
          });
        });
      }

      function renderMemoImages() {
        const key = makeDateKey(selectedDate);
        const images = getMemoImagesForDate(key);
        const memoPhotoStrip = document.getElementById('memoPhotoStrip');

        if (!images.length) {
          memoPhotoStrip.innerHTML = '';
          return;
        }

        memoPhotoStrip.innerHTML = images
          .map(
            (image, index) => `
              <div class="memo-photo-item">
                <button class="memo-photo-thumb" type="button" data-index="${index}" aria-label="메모 사진 ${index + 1} 크게 보기">
                  <img src="${image}" alt="메모 사진 ${index + 1}" />
                </button>
                <button class="memo-photo-remove" type="button" data-index="${index}" aria-label="메모 사진 ${index + 1} 삭제">×</button>
              </div>
            `
          )
          .join('');

        memoPhotoStrip.querySelectorAll('.memo-photo-thumb').forEach((button) => {
          button.addEventListener('click', () => {
            const index = Number(button.dataset.index);
            const modal = document.getElementById('memoImageModal');
            const modalImg = document.getElementById('memoImageModalImg');
            modalImg.src = images[index];
            modal.classList.add('show');
          });
        });

        memoPhotoStrip.querySelectorAll('.memo-photo-remove').forEach((button) => {
          button.addEventListener('click', (event) => {
            event.stopPropagation();
            const index = Number(button.dataset.index);
            const updatedImages = getMemoImagesForDate(key).filter((_, imageIndex) => imageIndex !== index);
            setMemoImagesForDate(key, updatedImages);
            renderMemoImages();
          });
        });
      }

      function renderRoutinePanel() {
        const key = makeDateKey(selectedDate);
        const routines = getRoutinesForDate(key);
        const routineList = document.getElementById('routineList');
        const weatherButtons = document.querySelectorAll('.weather-btn');
        const selectedWeather = getWeatherForDate(key);

        weatherButtons.forEach((button) => {
          const isActive = button.dataset.weather === selectedWeather;
          button.classList.toggle('active', isActive);
        });

        routineList.innerHTML = routines
          .map(
            (routine) => `
              <li class="routine-item">
                <div class="routine-main">
                  <span class="routine-bullet"></span>
                  <span class="routine-text">${routine.title}</span>
                </div>
                <span class="routine-meta">${routine.repeat}</span>
              </li>
            `
          )
          .join('');
      }

      function renderAlarms() {
        const key = makeDateKey(selectedDate);
        const alarms = getAlarmsForDate(key);
        const alarmList = document.getElementById('alarmList');

        if (!alarms.length) {
          alarmList.innerHTML = '<li class="alarm-item"><div class="alarm-item-title"><strong>등록된 알람이 없어요</strong><small>날짜와 시간을 선택해 알람을 추가해보세요.</small></div></li>';
          return;
        }

        alarmList.innerHTML = alarms
          .map(
            (alarm) => `
              <li class="alarm-item">
                <div class="alarm-item-title">
                  <strong>${alarm.title}</strong>
                  <small>${alarm.date || makeDateKey(selectedDate)} ${alarm.time || '09:00'}</small>
                </div>
                <div class="alarm-actions">
                  <button class="alarm-toggle" type="button" data-id="${alarm.id}">${alarm.enabled ? 'ON' : 'OFF'}</button>
                  <button class="alarm-delete" type="button" data-id="${alarm.id}">삭제</button>
                </div>
              </li>
            `
          )
          .join('');

        alarmList.querySelectorAll('.alarm-toggle').forEach((button) => {
          button.addEventListener('click', () => {
            const targetId = Number(button.dataset.id);
            const list = getAlarmsForDate(key).map((alarm) =>
              alarm.id === targetId ? { ...alarm, enabled: !alarm.enabled } : alarm
            );
            setAlarmsForDate(key, list);
            renderAlarms();
          });
        });

        alarmList.querySelectorAll('.alarm-delete').forEach((button) => {
          button.addEventListener('click', () => {
            const targetId = Number(button.dataset.id);
            const list = getAlarmsForDate(key).filter((alarm) => alarm.id !== targetId);
            setAlarmsForDate(key, list);
            renderAlarms();
          });
        });
      }

      memoInput.addEventListener('input', (event) => {
        const key = makeDateKey(selectedDate);
        setMemoForDate(key, event.target.value);
        renderChecklist();
      });

      document.getElementById('taskAddBtn').addEventListener('click', () => {
        const title = window.prompt('추가할 할 일을 입력하세요.');
        if (!title || !title.trim()) return;

        const tag = window.prompt('카테고리를 입력하세요.', '기타');
        const key = makeDateKey(selectedDate);
        const tasks = getTasksForDate(key);
        tasks.push({
          id: Date.now(),
          text: title.trim(),
          tag: tag && tag.trim() ? tag.trim() : '기타',
          done: false
        });

        setTasksForDate(key, tasks);
        renderCalendar();
        renderChecklist();
      });

      document.getElementById('memoAddBookBtn').addEventListener('click', () => {
        const key = makeDateKey(selectedDate);
        const entries = getMemoEntriesForDate(key);
        const nextEntry = { id: Date.now(), text: '' };
        const updatedEntries = [...entries, nextEntry];

        setMemoEntriesForDate(key, updatedEntries);
        renderChecklist();

        requestAnimationFrame(() => {
          const addedTextarea = document.querySelector(`textarea[data-entry-id="${nextEntry.id}"]`);
          if (addedTextarea) {
            addedTextarea.focus();
          }
        });
      });

      document.getElementById('memoAddPhotoBtn').addEventListener('click', () => {
        document.getElementById('memoImageInput').click();
      });

      document.getElementById('memoImageInput').addEventListener('change', (event) => {
        const files = Array.from(event.target.files || []);
        if (!files.length) return;

        const key = makeDateKey(selectedDate);
        const existing = getMemoImagesForDate(key);

        Promise.all(
          files.map(
            (file) =>
              new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
              })
          )
        )
          .then((results) => {
            setMemoImagesForDate(key, [...existing, ...results]);
            renderMemoImages();
            event.target.value = '';
          })
          .catch(() => {
            event.target.value = '';
          });
      });

      document.getElementById('memoImageModalClose').addEventListener('click', () => {
        document.getElementById('memoImageModal').classList.remove('show');
      });

      document.getElementById('memoImageModal').addEventListener('click', (event) => {
        if (event.target.id === 'memoImageModal') {
          event.target.classList.remove('show');
        }
      });

      document.getElementById('routineAddBtn').addEventListener('click', () => {
        const key = makeDateKey(selectedDate);
        const title = window.prompt('추가할 루틴을 입력하세요.', '아침 산책');
        if (!title || !title.trim()) return;

        const routines = getRoutinesForDate(key);
        routines.push({
          id: Date.now(),
          title: title.trim(),
          repeat: '반복',
          weather: getWeatherForDate(key)
        });

        setRoutinesForDate(key, routines);
        renderRoutinePanel();
      });

      document.querySelectorAll('.weather-btn').forEach((button) => {
        button.addEventListener('click', () => {
          const key = makeDateKey(selectedDate);
          const selectedWeather = button.dataset.weather;
          setWeatherForDate(key, selectedWeather);
          renderRoutinePanel();
        });
      });

      document.getElementById('saveAlarmBtn').addEventListener('click', () => {
        const titleInput = document.getElementById('alarmTitle');
        const dateInput = document.getElementById('alarmDate');
        const timeInput = document.getElementById('alarmTime');

        const title = titleInput.value.trim();
        const date = dateInput.value || makeDateKey(selectedDate);
        const time = timeInput.value || '09:00';

        if (!title) {
          titleInput.focus();
          return;
        }

        const key = makeDateKey(selectedDate);
        const alarms = getAlarmsForDate(key);
        alarms.push({
          id: Date.now(),
          title,
          date,
          time,
          enabled: true
        });

        setAlarmsForDate(key, alarms);
        titleInput.value = '';
        dateInput.value = '';
        timeInput.value = '';
        renderAlarms();
      });

      document.querySelector('.month-nav').addEventListener('click', () => {
        const nextDate = new Date(selectedDate);
        nextDate.setDate(nextDate.getDate() - 7);
        selectedDate = new Date(nextDate);
        renderCalendar();
        renderChecklist();
        renderRoutinePanel();
        renderAlarms();
      });

      document.querySelectorAll('.month-nav')[1].addEventListener('click', () => {
        const nextDate = new Date(selectedDate);
        nextDate.setDate(nextDate.getDate() + 7);
        selectedDate = new Date(nextDate);
        renderCalendar();
        renderChecklist();
        renderRoutinePanel();
        renderAlarms();
      });

      document.getElementById('alarmDate').value = makeDateKey(selectedDate);

      renderCalendar();
      renderChecklist();
      renderRoutinePanel();
      renderAlarms();
    </script>
  </body>
</html>
